---
# playbooks/calico.yml
# Deploys Calico CNI (v3.29.1) across the Kubernetes cluster.

- name: Deploy Calico CNI Networking & Policy Engine
  hosts: k8s_cluster
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load encrypted vault variables if vault.yml exists
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/vault.yml"
      when: ( inventory_dir ~ '/group_vars/vault.yml' ) is file
      no_log: true
      tags: [always]

  roles:
    - role: calico
      tags: [calico, cni]

