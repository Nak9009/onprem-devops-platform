---
# playbooks/gitlab.yml
# Deploys and configures GitLab CE on nodes in the 'gitlab' inventory group.

- name: Deploy GitLab CE Source Control Management Server
  hosts: gitlab
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load encrypted vault variables if vault.yml exists
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/vault.yml"
      when: ( inventory_dir ~ '/group_vars/vault.yml' ) is file
      no_log: true
      tags: [always]

  roles:
    - role: gitlab
      tags: [gitlab]

