---
# playbooks/nexus.yml
# Deploys Docker Engine and Sonatype Nexus Repository OSS on nodes in the 'nexus' group.

- name: Deploy Sonatype Nexus Artifact & Private Docker Registry
  hosts: nexus
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load encrypted vault variables if vault.yml exists
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/vault.yml"
      when: ( inventory_dir ~ '/group_vars/vault.yml' ) is file
      no_log: true
      tags: [always]

  roles:
    - role: docker
      tags: [docker, nexus]
    - role: nexus
      tags: [nexus]

