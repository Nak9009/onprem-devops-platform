---
# playbooks/site.yml
# Master Orchestration Playbook for On-Premises DevOps Platform
# Executes all phased playbooks in dependency order across Local or Production inventories.

- name: "Phase 1/2: Common OS Baseline & Hardening"
  ansible.builtin.import_playbook: common.yml
  tags: [phase1, phase2, common]

- name: "Phase 3a: GitLab CE Source Control"
  ansible.builtin.import_playbook: gitlab.yml
  tags: [phase3, gitlab]

- name: "Phase 3b: Sonatype Nexus Repository & Private Docker Registry"
  ansible.builtin.import_playbook: nexus.yml
  tags: [phase3, nexus]

- name: "Phase 3c: MinIO S3 Object Storage"
  ansible.builtin.import_playbook: minio.yml
  tags: [phase3, minio]

- name: "Phase 3d: Jenkins LTS CI Server"
  ansible.builtin.import_playbook: jenkins.yml
  tags: [phase3, jenkins]

- name: "Phase 4a: Containerd CRI & Kubernetes Cluster"
  ansible.builtin.import_playbook: kubernetes.yml
  tags: [phase4, kubernetes]

- name: "Phase 4b: Calico CNI Networking & NetworkPolicy Engine"
  ansible.builtin.import_playbook: calico.yml
  tags: [phase4, calico]

- name: "Phase 4c: Rancher Cluster Management"
  ansible.builtin.import_playbook: rancher.yml
  tags: [phase4, rancher]

- name: "Phase 4d: Argo CD GitOps Controller"
  ansible.builtin.import_playbook: argocd.yml
  tags: [phase4, argocd]

- name: "Phase 6a: Prometheus & Grafana Monitoring Stack"
  ansible.builtin.import_playbook: monitoring.yml
  tags: [phase6, monitoring]

- name: "Phase 6b: Grafana Loki & Promtail Centralized Logging"
  ansible.builtin.import_playbook: logging.yml
  tags: [phase6, logging]

- name: "Phase 6c: Platform Security Hardening & HashiCorp Vault"
  ansible.builtin.import_playbook: security.yml
  tags: [phase6, security]
