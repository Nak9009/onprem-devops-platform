---
# playbooks/site.yml
# Master 3-Layer Orchestration Playbook for On-Premises DevOps Platform
# Executes Layer 1 (Infrastructure, DevOps, DB HA, Storage, Monitoring),
# Layer 2 (Management Kubernetes Cluster with Rancher + Argo CD), and
# Layer 3 (Application Kubernetes Cluster for Business Workloads Only).

- name: "Phase 1 & 2: OS Baseline, Kernel Hardening, UFW & Security"
  ansible.builtin.import_playbook: infrastructure.yml
  tags: [phase1, phase2, infrastructure]

- name: "Phase 3a: Layer 1 DevOps Services (GitLab, Nexus, Jenkins & Agents)"
  ansible.builtin.import_playbook: devops-services.yml
  tags: [phase3, devops]

- name: "Phase 3b: Layer 1 Database HA (PostgreSQL pg-db1..3 + Redis)"
  ansible.builtin.import_playbook: database.yml
  tags: [phase3, database]

- name: "Phase 3c: Layer 1 Object Storage (MinIO S3) & Independent Backup"
  ansible.builtin.import_playbook: storage.yml
  tags: [phase3, storage]

- name: "Phase 4a: Layer 2 Dedicated Kubernetes Management Cluster (Rancher + Argo CD)"
  ansible.builtin.import_playbook: management-cluster.yml
  tags: [phase4, management_cluster]

- name: "Phase 4b: Layer 3 Application Kubernetes Cluster (Business Workloads Only)"
  ansible.builtin.import_playbook: application-cluster.yml
  tags: [phase4, application_cluster]

- name: "Phase 6a: Layer 1 Independent Monitoring (Prometheus + Grafana)"
  ansible.builtin.import_playbook: monitoring.yml
  tags: [phase6, monitoring]

- name: "Phase 6b: Layer 1 Independent Centralized Logging (Loki + Promtail)"
  ansible.builtin.import_playbook: logging.yml
  tags: [phase6, logging]
