---
# playbooks/site.yml
# Master Orchestration Playbook for On-Premises DevOps Platform
# Executes phased playbooks in dependency order.

- name: "Phase 1/2: Common OS Baseline & Hardening"
  ansible.builtin.import_playbook: common.yml
  tags: [phase1, phase2, common]

- name: "Phase 3a: GitLab CE Source Control"
  ansible.builtin.import_playbook: gitlab.yml
  tags: [phase3, gitlab]

- name: "Phase 3b: Sonatype Nexus Repository & Private Docker Registry"
  ansible.builtin.import_playbook: nexus.yml
  tags: [phase3, nexus]

- name: "Phase 3c: MinIO S3 Object Storage"
  ansible.builtin.import_playbook: minio.yml
  tags: [phase3, minio]

- name: "Phase 3d: Jenkins LTS CI Server"
  ansible.builtin.import_playbook: jenkins.yml
  tags: [phase3, jenkins]

