---
# playbooks/minio.yml
# Deploys MinIO S3-Compatible Object Storage on nodes in the 'minio' group.

- name: Deploy MinIO S3-Compatible Object Storage
  hosts: minio
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load encrypted vault variables if vault.yml exists
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/vault.yml"
      when: ( inventory_dir ~ '/group_vars/vault.yml' ) is file
      no_log: true
      tags: [always]

  roles:
    - role: minio
      tags: [minio]

