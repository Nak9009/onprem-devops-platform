---
# playbooks/argocd.yml
# Deploys Argo CD GitOps Controller, CLI, RBAC, and AppProjects on the Kubernetes cluster.

- name: Deploy Argo CD GitOps Continuous Delivery Controller
  hosts: k8s_control_plane
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load encrypted vault variables if vault.yml exists
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/vault.yml"
      when: ( inventory_dir ~ '/group_vars/vault.yml' ) is file
      no_log: true
      tags: [always]

  roles:
    - role: argocd
      tags: [argocd, gitops]
