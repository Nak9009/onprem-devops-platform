---
# playbooks/rancher.yml
# Deploys Docker Engine and Rancher Multi-Cluster Management Server on the 'rancher' group.

- name: Deploy Rancher Kubernetes Cluster Management Server
  hosts: rancher
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load encrypted vault variables if vault.yml exists
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/vault.yml"
      when: ( inventory_dir ~ '/group_vars/vault.yml' ) is file
      no_log: true
      tags: [always]

  roles:
    - role: docker
      tags: [docker, rancher]
    - role: rancher
      tags: [rancher]

