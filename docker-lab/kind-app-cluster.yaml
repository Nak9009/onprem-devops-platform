# docker-lab/kind-app-cluster.yaml
# Layer 3: Application Kubernetes Cluster Configuration (KinD)
# Dedicated strictly to business applications deployed via Argo CD.
#
# IMPORTANT: Never deploy GitLab, Jenkins, Nexus, DBs, or Argo CD into this cluster.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: onprem-app-k8s
networking:
  ipFamily: ipv4
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6444
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"

nodes:
  - role: control-plane
    image: kindest/node:v1.31.4

  - role: worker
    image: kindest/node:v1.31.4
    extraPortMappings:
      # Application Ingress Controller HTTP
      - containerPort: 80
        hostPort: 8088
        protocol: TCP
      # Application Ingress Controller HTTPS
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

