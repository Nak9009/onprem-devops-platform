---
# roles/grafana/defaults/main.yml

grafana_pinned_version: "{{ grafana_version | default('11.4.0') }}"
grafana_web_port: "{{ grafana_port | default(3000) }}"
grafana_admin_user: "admin"
grafana_admin_secret: "{{ vault_grafana_admin_password | default('ChangeMe_LocalGrafanaAdmin!2026') }}"

grafana_prometheus_url: "http://127.0.0.1:{{ prometheus_port | default(9090) }}"
grafana_loki_url: "http://127.0.0.1:{{ loki_port | default(3100) }}"

