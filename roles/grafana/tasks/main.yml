---
# roles/grafana/tasks/main.yml

- name: Install Grafana OSS ({{ grafana_pinned_version }}) on 'monitoring' nodes
  when: "'monitoring' in group_names"
  block:
    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download official Grafana GPG key
      ansible.builtin.get_url:
        url: "https://apt.grafana.com/gpg.key"
        dest: /etc/apt/keyrings/grafana.asc
        owner: root
        group: root
        mode: "0644"

    - name: Add Grafana DEB822 APT repository
      ansible.builtin.deb822_repository:
        name: grafana
        types: [deb]
        uris: ["https://apt.grafana.com"]
        suites: [stable]
        components: [main]
        signed_by: /etc/apt/keyrings/grafana.asc
        state: present

    - name: Install pinned Grafana package ({{ grafana_pinned_version }})
      block:
        - name: Install grafana={{ grafana_pinned_version }}
          ansible.builtin.apt:
            name: "grafana={{ grafana_pinned_version }}"
            state: present
            update_cache: true
            allow_downgrade: true
      rescue:
        - name: Fallback to available stable Grafana package in repository
          ansible.builtin.apt:
            name: grafana
            state: present
            update_cache: true

    - name: Ensure Grafana dashboards directory exists
      ansible.builtin.file:
        path: /var/lib/grafana/dashboards
        state: directory
        owner: grafana
        group: grafana
        mode: "0750"

    - name: Render /etc/grafana/grafana.ini
      ansible.builtin.template:
        src: grafana.ini.j2
        dest: /etc/grafana/grafana.ini
        owner: root
        group: grafana
        mode: "0640"
      no_log: true
      notify: Restart grafana-server

    - name: Provision Prometheus and Loki datasources in Grafana
      ansible.builtin.template:
        src: datasources.yml.j2
        dest: /etc/grafana/provisioning/datasources/devops-datasources.yml
        owner: root
        group: grafana
        mode: "0640"
      notify: Restart grafana-server

    - name: Provision Grafana dashboard provider configuration
      ansible.builtin.template:
        src: dashboards-provider.yml.j2
        dest: /etc/grafana/provisioning/dashboards/devops-dashboards.yml
        owner: root
        group: grafana
        mode: "0640"
      notify: Restart grafana-server

    - name: Render pre-built DevOps Platform Overview dashboard JSON
      ansible.builtin.template:
        src: devops-overview-dashboard.json.j2
        dest: /var/lib/grafana/dashboards/devops-overview.json
        owner: grafana
        group: grafana
        mode: "0640"
      notify: Restart grafana-server

    - name: Open Grafana HTTP port ({{ grafana_web_port }}) in UFW
      community.general.ufw:
        rule: allow
        port: "{{ grafana_web_port | string }}"
        proto: tcp
        comment: "Grafana Dashboards Web UI"
      when: ufw_enabled | default(true) | bool

    - name: Ensure grafana-server service is started and enabled
      ansible.builtin.systemd:
        name: grafana-server
        state: started
        enabled: true
        daemon_reload: true

    - name: Flush handlers before validating Grafana health endpoint
      ansible.builtin.meta: flush_handlers

    - name: Validate Grafana /api/health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_web_port }}/api/health"
        method: GET
        status_code: 200
      register: grafana_health
      retries: 20
      delay: 5
      until: grafana_health.status == 200

    - name: Display Grafana readiness summary
      ansible.builtin.debug:
        msg: "[PASS] Grafana v{{ grafana_pinned_version }} is active on http://{{ grafana_domain }}:{{ grafana_web_port }}"
  tags: [grafana, monitoring, validate]

