---
# roles/security/handlers/main.yml

- name: Restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Restart vault
  ansible.builtin.systemd:
    name: vault
    state: restarted
    daemon_reload: true

- name: Reload security sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

