---
# roles/common/handlers/main.yml

- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: Reload ufw
  community.general.ufw:
    state: reloaded
  when: common_ufw_enabled | bool

