---
# roles/common/tasks/hosts.yml

- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
    use: systemd

- name: Populate /etc/hosts with platform inventory records
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: common_manage_etc_hosts | bool

