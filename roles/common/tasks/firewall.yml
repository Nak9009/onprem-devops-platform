---
# roles/common/tasks/firewall.yml

- name: Configure UFW baseline rules
  when: common_ufw_enabled | bool
  block:
    - name: Allow OpenSSH connections before enabling UFW
      community.general.ufw:
        rule: allow
        port: "{{ common_ssh_port | string }}"
        proto: tcp
        comment: "Allow SSH management access"

    - name: Allow intra-cluster traffic from management subnet
      community.general.ufw:
        rule: allow
        from_ip: "{{ common_management_subnet }}"
        comment: "Allow trusted internal DevOps management subnet"

    - name: Allow intra-subnet traffic on primary interface network
      community.general.ufw:
        rule: allow
        from_ip: "{{ ansible_default_ipv4.network }}/{{ ansible_default_ipv4.prefix }}"
        comment: "Allow local interface subnet traffic"
      when:
        - ansible_default_ipv4.network is defined
        - ansible_default_ipv4.prefix is defined

    - name: Allow Pod CIDR traffic on Kubernetes nodes
      community.general.ufw:
        rule: allow
        from_ip: "{{ pod_cidr }}"
        comment: "Allow Kubernetes Pod CIDR traffic"
      when: "'k8s_cluster' in group_names"

    - name: Allow Service CIDR traffic on Kubernetes nodes
      community.general.ufw:
        rule: allow
        from_ip: "{{ service_cidr }}"
        comment: "Allow Kubernetes Service CIDR traffic"
      when: "'k8s_cluster' in group_names"

    - name: Set UFW default incoming policy
      community.general.ufw:
        direction: incoming
        policy: "{{ common_ufw_default_incoming }}"

    - name: Set UFW default outgoing policy
      community.general.ufw:
        direction: outgoing
        policy: "{{ common_ufw_default_outgoing }}"

    - name: Enable UFW firewall
      community.general.ufw:
        state: enabled

