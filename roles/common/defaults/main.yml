---
# roles/common/defaults/main.yml

common_timezone: "{{ timezone | default('Asia/Phnom_Penh') }}"
common_locale: "{{ locale | default('en_US.UTF-8') }}"
common_domain: "{{ domain | default('devops.local') }}"
common_admin_user: "{{ admin_user | default('ansible') }}"
common_ssh_port: "{{ ssh_port | default(22) }}"
common_ssh_disable_password_auth: "{{ ssh_disable_password_auth | default(true) }}"
common_ssh_permit_root_login: "{{ ssh_permit_root_login | default('no') }}"

common_ntp_servers: "{{ ntp_servers | default(['0.ubuntu.pool.ntp.org', '1.ubuntu.pool.ntp.org']) }}"

common_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - wget
  - gnupg
  - lsb-release
  - software-properties-common
  - jq
  - git
  - vim
  - htop
  - iotop
  - net-tools
  - dnsutils
  - iproute2
  - iputils-ping
  - traceroute
  - ufw
  - fail2ban
  - unattended-upgrades
  - chrony
  - bash-completion
  - tar
  - unzip
  - rsync
  - socat
  - conntrack
  - ebtables
  - ethtool
  - python3-pip
  - python3-venv

common_sysctl_settings:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 512
  fs.file-max: 2097152
  vm.max_map_count: 262144
  vm.swappiness: 10
  net.core.somaxconn: 32768
  net.ipv4.tcp_max_syn_backlog: 8096

common_kernel_modules:
  - overlay
  - br_netfilter

common_ulimit_nofile_soft: 65536
common_ulimit_nofile_hard: 131072
common_ulimit_nproc_soft: 32768
common_ulimit_nproc_hard: 65536

common_ufw_enabled: "{{ ufw_enabled | default(true) }}"
common_ufw_default_incoming: "{{ ufw_default_incoming_policy | default('deny') }}"
common_ufw_default_outgoing: "{{ ufw_default_outgoing_policy | default('allow') }}"
common_management_subnet: "{{ management_subnet | default('192.168.64.0/24') }}"
common_manage_etc_hosts: true

