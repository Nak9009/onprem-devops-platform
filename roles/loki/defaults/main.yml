---
# roles/loki/defaults/main.yml

loki_pinned_version: "{{ loki_version | default('3.3.2') }}"
promtail_pinned_version: "{{ promtail_version | default('3.3.2') }}"
loki_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

loki_zip_url: "https://github.com/grafana/loki/releases/download/v{{ loki_pinned_version }}/loki-linux-{{ loki_arch }}.zip"
promtail_zip_url: "https://github.com/grafana/loki/releases/download/v{{ promtail_pinned_version }}/promtail-linux-{{ loki_arch }}.zip"

loki_user: "loki"
loki_group: "loki"
loki_config_dir: "/etc/loki"
loki_data_dir: "/var/lib/loki"
loki_http_port: "{{ loki_port | default(3100) }}"

loki_server_host: "{{ groups['monitoring'][0] | default('127.0.0.1') }}"
loki_server_ip: "{{ hostvars[loki_server_host]['ansible_default_ipv4']['address'] | default(hostvars[loki_server_host]['ansible_host'] | default('127.0.0.1')) }}"
loki_push_url: "http://{{ loki_server_ip }}:{{ loki_http_port }}/loki/api/v1/push"

