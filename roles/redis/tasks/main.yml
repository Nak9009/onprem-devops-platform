---
# roles/redis/tasks/main.yml
# Deploys dedicated Redis Cache/Queue/Session service outside Kubernetes + Prometheus Exporter

- name: Install Redis Server, Redis Sentinel, and Prometheus Redis Exporter
  ansible.builtin.apt:
    name:
      - redis-server
      - redis-sentinel
      - prometheus-redis-exporter
    state: present
    update_cache: true

- name: Render hardened /etc/redis/redis.conf
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: "0640"

- name: Open Redis (6379), Sentinel (26379), and Exporter (9121) ports in UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: tcp
    comment: "{{ item.comment }}"
  loop:
    - { port: "{{ redis_port }}", comment: "Redis Server" }
    - { port: "{{ redis_sentinel_port }}", comment: "Redis Sentinel HA" }
    - { port: "{{ redis_exporter_port }}", comment: "Prometheus Redis Exporter" }
  when: ufw_enabled | default(true) | bool

- name: Ensure redis-server and prometheus-redis-exporter are started and enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - redis-server
    - prometheus-redis-exporter

