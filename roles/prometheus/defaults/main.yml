---
# roles/prometheus/defaults/main.yml

prometheus_pinned_version: "{{ prometheus_version | default('2.53.3') }}"
node_exporter_pinned_version: "{{ node_exporter_version | default('1.8.2') }}"
alertmanager_pinned_version: "{{ alertmanager_version | default('0.27.0') }}"

prometheus_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
prometheus_url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_pinned_version }}/prometheus-{{ prometheus_pinned_version }}.linux-{{ prometheus_arch }}.tar.gz"
node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_pinned_version }}/node_exporter-{{ node_exporter_pinned_version }}.linux-{{ prometheus_arch }}.tar.gz"

prometheus_user: "prometheus"
prometheus_group: "prometheus"
prometheus_config_dir: "/etc/prometheus"
prometheus_data_dir: "/var/lib/prometheus"
prometheus_web_port: "{{ prometheus_port | default(9090) }}"
prometheus_retention_time: "{{ '15d' if (environment | default('local')) == 'local' else '30d' }}"

node_exporter_user: "node_exporter"
node_exporter_group: "node_exporter"
node_exporter_web_port: "{{ node_exporter_port | default(9100) }}"

