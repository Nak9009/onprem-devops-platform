---
# roles/prometheus/tasks/main.yml

- name: Deploy Prometheus Node Exporter across all platform nodes
  block:
    - name: Create node_exporter system group
      ansible.builtin.group:
        name: "{{ node_exporter_group }}"
        system: true
        state: present

    - name: Create node_exporter system user
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Check if node_exporter binary is already installed at target version
      ansible.builtin.stat:
        path: /usr/local/bin/node_exporter
      register: node_exporter_bin

    - name: Download and extract node_exporter ({{ node_exporter_pinned_version }})
      when: not node_exporter_bin.stat.exists
      block:
        - name: Download node_exporter tarball
          ansible.builtin.get_url:
            url: "{{ node_exporter_url }}"
            dest: "/tmp/node_exporter-{{ node_exporter_pinned_version }}.tar.gz"
            mode: "0644"

        - name: Extract node_exporter archive
          ansible.builtin.unarchive:
            src: "/tmp/node_exporter-{{ node_exporter_pinned_version }}.tar.gz"
            dest: /tmp
            remote_src: true

        - name: Copy node_exporter binary to /usr/local/bin
          ansible.builtin.copy:
            src: "/tmp/node_exporter-{{ node_exporter_pinned_version }}.linux-{{ prometheus_arch }}/node_exporter"
            dest: /usr/local/bin/node_exporter
            remote_src: true
            owner: root
            group: root
            mode: "0755"

    - name: Render /etc/systemd/system/node_exporter.service
      ansible.builtin.template:
        src: node_exporter.service.j2
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart node_exporter

    - name: Open Node Exporter port ({{ node_exporter_web_port }}) in UFW
      community.general.ufw:
        rule: allow
        port: "{{ node_exporter_web_port | string }}"
        proto: tcp
        comment: "Prometheus Node Exporter"
      when: ufw_enabled | default(true) | bool

    - name: Ensure node_exporter service is started and enabled
      ansible.builtin.systemd:
        name: node_exporter
        state: started
        enabled: true
        daemon_reload: true
  tags: [prometheus, node_exporter]

- name: Deploy Prometheus Server on 'monitoring' group nodes
  when: "'monitoring' in group_names"
  block:
    - name: Create prometheus system group
      ansible.builtin.group:
        name: "{{ prometheus_group }}"
        system: true
        state: present

    - name: Create prometheus system user
      ansible.builtin.user:
        name: "{{ prometheus_user }}"
        group: "{{ prometheus_group }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ prometheus_data_dir }}"
        create_home: false
        state: present

    - name: Create Prometheus configuration and TSDB storage directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ prometheus_user }}"
        group: "{{ prometheus_group }}"
        mode: "0750"
      loop:
        - "{{ prometheus_config_dir }}"
        - "{{ prometheus_config_dir }}/rules"
        - "{{ prometheus_data_dir }}"

    - name: Check if prometheus binary is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/prometheus
      register: prometheus_bin

    - name: Download and extract Prometheus ({{ prometheus_pinned_version }})
      when: not prometheus_bin.stat.exists
      block:
        - name: Download Prometheus tarball
          ansible.builtin.get_url:
            url: "{{ prometheus_url }}"
            dest: "/tmp/prometheus-{{ prometheus_pinned_version }}.tar.gz"
            mode: "0644"

        - name: Extract Prometheus archive
          ansible.builtin.unarchive:
            src: "/tmp/prometheus-{{ prometheus_pinned_version }}.tar.gz"
            dest: /tmp
            remote_src: true

        - name: Copy prometheus and promtool binaries to /usr/local/bin
          ansible.builtin.copy:
            src: "/tmp/prometheus-{{ prometheus_pinned_version }}.linux-{{ prometheus_arch }}/{{ item }}"
            dest: "/usr/local/bin/{{ item }}"
            remote_src: true
            owner: root
            group: root
            mode: "0755"
          loop:
            - prometheus
            - promtool

    - name: Render Prometheus alert rules (/etc/prometheus/rules/alert.rules.yml)
      ansible.builtin.template:
        src: alert.rules.yml.j2
        dest: "{{ prometheus_config_dir }}/rules/alert.rules.yml"
        owner: "{{ prometheus_user }}"
        group: "{{ prometheus_group }}"
        mode: "0640"
      notify: Reload prometheus

    - name: Render /etc/prometheus/prometheus.yml configuration
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: "{{ prometheus_config_dir }}/prometheus.yml"
        owner: "{{ prometheus_user }}"
        group: "{{ prometheus_group }}"
        mode: "0640"
        validate: "/usr/local/bin/promtool check config %s"
      notify: Reload prometheus

    - name: Render /etc/systemd/system/prometheus.service
      ansible.builtin.template:
        src: prometheus.service.j2
        dest: /etc/systemd/system/prometheus.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart prometheus

    - name: Open Prometheus Web UI port ({{ prometheus_web_port }}) in UFW
      community.general.ufw:
        rule: allow
        port: "{{ prometheus_web_port | string }}"
        proto: tcp
        comment: "Prometheus Web UI and Query API"
      when: ufw_enabled | default(true) | bool

    - name: Ensure Prometheus service is started and enabled
      ansible.builtin.systemd:
        name: prometheus
        state: started
        enabled: true
        daemon_reload: true

    - name: Flush handlers before Prometheus health validation
      ansible.builtin.meta: flush_handlers

    - name: Validate Prometheus /-/healthy endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_web_port }}/-/healthy"
        method: GET
        status_code: 200
      register: prom_health
      retries: 15
      delay: 5
      until: prom_health.status == 200

    - name: Display Prometheus readiness summary
      ansible.builtin.debug:
        msg: "[PASS] Prometheus v{{ prometheus_pinned_version }} is active on http://{{ prometheus_domain }}:{{ prometheus_web_port }}"
  tags: [prometheus, server, validate]

