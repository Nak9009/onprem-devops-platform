---
# roles/prometheus/handlers/main.yml

- name: Restart prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
    daemon_reload: true

- name: Reload prometheus
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_web_port }}/-/reload"
    method: POST
    status_code: 200

- name: Restart node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted
    daemon_reload: true

