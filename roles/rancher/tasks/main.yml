---
# roles/rancher/tasks/main.yml

- name: Validate hardware prerequisites for Rancher Server
  ansible.builtin.assert:
    that:
      - ansible_memtotal_mb >= 2000
    fail_msg: "Rancher requires at least 2 GB RAM. Detected: {{ ansible_memtotal_mb }} MB."
  tags: [rancher, prereqs]

- name: Create persistent Rancher state directory (/var/lib/rancher)
  ansible.builtin.file:
    path: "{{ rancher_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags: [rancher, storage]

- name: Open Rancher HTTP and HTTPS ports in UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: tcp
    comment: "{{ item.comment }}"
  loop:
    - { port: "{{ rancher_http_host_port }}", comment: "Rancher HTTP" }
    - { port: "{{ rancher_https_host_port }}", comment: "Rancher HTTPS UI and Cluster Tunnel" }
  when: ufw_enabled | default(true) | bool
  tags: [rancher, firewall]

- name: Pull pinned Rancher container image ({{ rancher_container_image }})
  ansible.builtin.command:
    cmd: "docker pull {{ rancher_container_image }}"
  register: rancher_pull_out
  changed_when: "'Downloaded newer image' in rancher_pull_out.stdout"
  retries: 3
  delay: 10
  until: rancher_pull_out is succeeded
  tags: [rancher, packages]

- name: Render /etc/systemd/system/rancher.service
  ansible.builtin.template:
    src: rancher.service.j2
    dest: /etc/systemd/system/rancher.service
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart rancher
  tags: [rancher, config]

- name: Ensure Rancher service is started and enabled
  ansible.builtin.systemd:
    name: rancher
    state: started
    enabled: true
    daemon_reload: true
  tags: [rancher, service]

- name: Flush handlers before validating Rancher endpoint
  ansible.builtin.meta: flush_handlers
  tags: [rancher, validate]

- name: Wait for Rancher HTTPS ping endpoint to respond
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ rancher_https_host_port }}/ping"
    validate_certs: false
    status_code: 200
  register: rancher_ping_check
  retries: 36
  delay: 10
  until: rancher_ping_check.status == 200
  tags: [rancher, validate]

- name: Display Rancher readiness summary
  ansible.builtin.debug:
    msg: "[PASS] Rancher ({{ rancher_pinned_version }}) is active and healthy at https://{{ rancher_domain }}"
  tags: [rancher, validate]
