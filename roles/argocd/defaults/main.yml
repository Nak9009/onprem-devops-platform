---
# roles/argocd/defaults/main.yml

argocd_pinned_version: "{{ argocd_version | default('v2.13.2') }}"
argocd_namespace: "argocd"
argocd_manifest_url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_pinned_version }}/manifests/install.yaml"
argocd_cli_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
argocd_cli_url: "https://github.com/argoproj/argo-cd/releases/download/{{ argocd_pinned_version }}/argocd-linux-{{ argocd_cli_arch }}"

argocd_primary_cp: "{{ groups['k8s_control_plane'][0] }}"
argocd_admin_secret: "{{ vault_argocd_admin_password | default('ChangeMe_LocalArgoCDAdmin!2026') }}"
argocd_nodeport_https: 30443

