---
# Local Multipass Inventory (Template / Default Static Mapping)
# Note: Run ./multipass/generate-inventory.sh after VM creation to automatically
# populate dynamic Multipass DHCP IP addresses into this inventory file.

all:
  children:
    devops_core:
      children:
        gitlab:
          hosts:
            devops-gitlab:
              ansible_host: "{{ lookup('env', 'GITLAB_IP') | default('192.168.64.10', true) }}"
        jenkins:
          hosts:
            devops-jenkins:
              ansible_host: "{{ lookup('env', 'JENKINS_IP') | default('192.168.64.11', true) }}"
        nexus:
          hosts:
            devops-nexus:
              ansible_host: "{{ lookup('env', 'NEXUS_IP') | default('192.168.64.12', true) }}"
        rancher:
          hosts:
            devops-rancher:
              ansible_host: "{{ lookup('env', 'RANCHER_IP') | default('192.168.64.13', true) }}"
        monitoring:
          hosts:
            devops-monitor:
              ansible_host: "{{ lookup('env', 'MONITOR_IP') | default('192.168.64.14', true) }}"
        minio:
          hosts:
            devops-nexus:
              ansible_host: "{{ lookup('env', 'NEXUS_IP') | default('192.168.64.12', true) }}"

    k8s_cluster:
      children:
        k8s_control_plane:
          hosts:
            k8s-cp01:
              ansible_host: "{{ lookup('env', 'K8S_CP01_IP') | default('192.168.64.21', true) }}"
              k8s_node_role: control-plane
        k8s_workers:
          hosts:
            k8s-worker01:
              ansible_host: "{{ lookup('env', 'K8S_WORKER01_IP') | default('192.168.64.22', true) }}"
              k8s_node_role: worker

