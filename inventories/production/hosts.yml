---
# inventories/production/hosts.yml
# Production VMware vSphere 3-Layer Inventory (VLANs 10-80)
# All host IPs are parameterized via environment variables or host_vars.

all:
  children:
    # ==========================================================================
    # Layer 1: DevOps, Databases, Object Storage, Monitoring & Backup (Outside K8s)
    # ==========================================================================
    devops_core:
      children:
        gitlab:
          hosts:
            prod-gitlab-01:
              ansible_host: "{{ lookup('env', 'PROD_GITLAB_IP') | default('10.20.20.10', true) }}"
        jenkins:
          hosts:
            prod-jenkins-01:
              ansible_host: "{{ lookup('env', 'PROD_JENKINS_IP') | default('10.20.20.11', true) }}"
        jenkins_agents:
          hosts:
            prod-jenkins-agent01:
              ansible_host: "{{ lookup('env', 'PROD_JENKINS_AGENT01_IP') | default('10.20.20.12', true) }}"
            prod-jenkins-agent02:
              ansible_host: "{{ lookup('env', 'PROD_JENKINS_AGENT02_IP') | default('10.20.20.13', true) }}"
        nexus:
          hosts:
            prod-nexus-01:
              ansible_host: "{{ lookup('env', 'PROD_NEXUS_IP') | default('10.20.20.14', true) }}"

        # Layer 1B: PostgreSQL 16 HA Cluster (VLAN 50: 10.20.50.0/24)
        postgresql_ha:
          hosts:
            pg-db1:
              ansible_host: "{{ lookup('env', 'PROD_PG_DB1_IP') | default('10.20.50.11', true) }}"
              pg_ha_role: leader
              patroni_priority: 110
            pg-db2:
              ansible_host: "{{ lookup('env', 'PROD_PG_DB2_IP') | default('10.20.50.12', true) }}"
              pg_ha_role: sync_standby
              patroni_priority: 100
            pg-db3:
              ansible_host: "{{ lookup('env', 'PROD_PG_DB3_IP') | default('10.20.50.13', true) }}"
              pg_ha_role: async_replica
              patroni_priority: 90

        # Layer 1B: Dedicated Redis Cache & Sentinel HA (VLAN 50)
        redis:
          hosts:
            prod-redis-01:
              ansible_host: "{{ lookup('env', 'PROD_REDIS01_IP') | default('10.20.50.21', true) }}"
              redis_role: master
            prod-redis-02:
              ansible_host: "{{ lookup('env', 'PROD_REDIS02_IP') | default('10.20.50.22', true) }}"
              redis_role: replica
            prod-redis-03:
              ansible_host: "{{ lookup('env', 'PROD_REDIS03_IP') | default('10.20.50.23', true) }}"
              redis_role: replica

        # Layer 1C: 4-Node Distributed MinIO S3 Storage (VLAN 60: 10.20.60.0/24)
        minio:
          hosts:
            prod-minio-01:
              ansible_host: "{{ lookup('env', 'PROD_MINIO01_IP') | default('10.20.60.11', true) }}"
            prod-minio-02:
              ansible_host: "{{ lookup('env', 'PROD_MINIO02_IP') | default('10.20.60.12', true) }}"
            prod-minio-03:
              ansible_host: "{{ lookup('env', 'PROD_MINIO03_IP') | default('10.20.60.13', true) }}"
            prod-minio-04:
              ansible_host: "{{ lookup('env', 'PROD_MINIO04_IP') | default('10.20.60.14', true) }}"

        # Layer 1D: Independent Monitoring, Logging, Security & Backup (VLANs 10/70/80)
        monitoring:
          hosts:
            prod-monitor-01:
              ansible_host: "{{ lookup('env', 'PROD_MONITOR_IP') | default('10.20.70.10', true) }}"
        backup_services:
          hosts:
            prod-backup-01:
              ansible_host: "{{ lookup('env', 'PROD_BACKUP_IP') | default('10.20.80.10', true) }}"
        security_services:
          hosts:
            prod-secops-01:
              ansible_host: "{{ lookup('env', 'PROD_SECOPS_IP') | default('10.20.10.16', true) }}"
        rancher:
          hosts:
            prod-k8s-mgmt-cp01:
              ansible_host: "{{ lookup('env', 'PROD_K8S_MGMT_CP01_IP') | default('10.20.30.11', true) }}"

    # ==========================================================================
    # Layer 2: Dedicated Kubernetes Management Cluster (VLAN 30: 10.20.30.0/24)
    # Hosts Rancher & Argo CD ONLY — No business application workloads
    # ==========================================================================
    k8s_mgmt_cluster:
      children:
        k8s_mgmt_control_plane:
          hosts:
            prod-k8s-mgmt-cp01:
              ansible_host: "{{ lookup('env', 'PROD_K8S_MGMT_CP01_IP') | default('10.20.30.11', true) }}"
              k8s_node_role: control-plane
              k8s_init_node: true
            prod-k8s-mgmt-cp02:
              ansible_host: "{{ lookup('env', 'PROD_K8S_MGMT_CP02_IP') | default('10.20.30.12', true) }}"
              k8s_node_role: control-plane
              k8s_init_node: false
            prod-k8s-mgmt-cp03:
              ansible_host: "{{ lookup('env', 'PROD_K8S_MGMT_CP03_IP') | default('10.20.30.13', true) }}"
              k8s_node_role: control-plane
              k8s_init_node: false

    # ==========================================================================
    # Layer 3: Application Kubernetes Cluster (VLAN 40: 10.20.40.0/24)
    # Hosts Business Applications ONLY
    # ==========================================================================
    k8s_app_cluster:
      children:
        k8s_control_plane:
          hosts:
            prod-k8s-cp01:
              ansible_host: "{{ lookup('env', 'PROD_K8S_CP01_IP') | default('10.20.40.11', true) }}"
              k8s_node_role: control-plane
              k8s_init_node: true
            prod-k8s-cp02:
              ansible_host: "{{ lookup('env', 'PROD_K8S_CP02_IP') | default('10.20.40.12', true) }}"
              k8s_node_role: control-plane
              k8s_init_node: false
            prod-k8s-cp03:
              ansible_host: "{{ lookup('env', 'PROD_K8S_CP03_IP') | default('10.20.40.13', true) }}"
              k8s_node_role: control-plane
              k8s_init_node: false
        k8s_workers:
          hosts:
            prod-k8s-worker01:
              ansible_host: "{{ lookup('env', 'PROD_K8S_WORKER01_IP') | default('10.20.40.21', true) }}"
              k8s_node_role: worker
            prod-k8s-worker02:
              ansible_host: "{{ lookup('env', 'PROD_K8S_WORKER02_IP') | default('10.20.40.22', true) }}"
              k8s_node_role: worker
            prod-k8s-worker03:
              ansible_host: "{{ lookup('env', 'PROD_K8S_WORKER03_IP') | default('10.20.40.23', true) }}"
              k8s_node_role: worker

    # Backward-compatible group alias for Application Kubernetes Cluster
    k8s_cluster:
      children:
        k8s_control_plane:
        k8s_workers:
