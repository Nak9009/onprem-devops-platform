---
# Production VMware vSphere Inventory
# All host IPs are parameterized via environment variables or host_vars.
# Override in inventories/production/host_vars/<hostname>.yml or via environment variables.

all:
  children:
    devops_core:
      children:
        gitlab:
          hosts:
            prod-gitlab-01:
              ansible_host: "{{ lookup('env', 'PROD_GITLAB_IP') | default('10.20.10.10', true) }}"
        jenkins:
          hosts:
            prod-jenkins-01:
              ansible_host: "{{ lookup('env', 'PROD_JENKINS_IP') | default('10.20.10.11', true) }}"
        nexus:
          hosts:
            prod-nexus-01:
              ansible_host: "{{ lookup('env', 'PROD_NEXUS_IP') | default('10.20.10.12', true) }}"
        rancher:
          hosts:
            prod-rancher-01:
              ansible_host: "{{ lookup('env', 'PROD_RANCHER_IP') | default('10.20.10.13', true) }}"
        monitoring:
          hosts:
            prod-monitor-01:
              ansible_host: "{{ lookup('env', 'PROD_MONITOR_IP') | default('10.20.10.14', true) }}"
        minio:
          hosts:
            prod-minio-01:
              ansible_host: "{{ lookup('env', 'PROD_MINIO_IP') | default('10.20.10.15', true) }}"
        security_services:
          hosts:
            prod-secops-01:
              ansible_host: "{{ lookup('env', 'PROD_SECOPS_IP') | default('10.20.10.16', true) }}"
        database_external:
          hosts:
            prod-postgres-01:
              ansible_host: "{{ lookup('env', 'PROD_POSTGRES_IP') | default('10.20.10.17', true) }}"

    k8s_cluster:
      children:
        k8s_control_plane:
          hosts:
            prod-k8s-cp01:
              ansible_host: "{{ lookup('env', 'PROD_K8S_CP01_IP') | default('10.20.20.21', true) }}"
              k8s_node_role: control-plane
              k8s_init_node: true
            prod-k8s-cp02:
              ansible_host: "{{ lookup('env', 'PROD_K8S_CP02_IP') | default('10.20.20.22', true) }}"
              k8s_node_role: control-plane
              k8s_init_node: false
            prod-k8s-cp03:
              ansible_host: "{{ lookup('env', 'PROD_K8S_CP03_IP') | default('10.20.20.23', true) }}"
              k8s_node_role: control-plane
              k8s_init_node: false
        k8s_workers:
          hosts:
            prod-k8s-worker01:
              ansible_host: "{{ lookup('env', 'PROD_K8S_WORKER01_IP') | default('10.20.20.31', true) }}"
              k8s_node_role: worker
            prod-k8s-worker02:
              ansible_host: "{{ lookup('env', 'PROD_K8S_WORKER02_IP') | default('10.20.20.32', true) }}"
              k8s_node_role: worker
            prod-k8s-worker03:
              ansible_host: "{{ lookup('env', 'PROD_K8S_WORKER03_IP') | default('10.20.20.33', true) }}"
              k8s_node_role: worker

