# multipass/profiles/compact.conf
# Profile: compact (Workstation-Safe Minimal Profile for 24 GB RAM hosts)
# Format: VM_NAME|CPUS|MEMORY|DISK|ANSIBLE_GROUPS
# Total Allocation: 12 vCPUs (shared), 16.5 GB RAM, 310 GB thin-provisioned disk
# Note: Keeps k8s-cp01 as a single-node Kubernetes cluster (control-plane + worker)
#       to stay safely under 70% of a 24 GB workstation's physical RAM.

devops-gitlab|2|4G|80G|gitlab
devops-jenkins|2|2560M|40G|jenkins
devops-nexus|2|3G|80G|nexus,minio
devops-rancher|2|2560M|30G|rancher
k8s-cp01|2|3G|40G|k8s_control_plane,k8s_workers
devops-monitor|2|1536M|40G|monitoring

