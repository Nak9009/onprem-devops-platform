# multipass/profiles/ha.conf
# Profile B: 3-Layer HA Architecture Simulation (Section 6 Specification)
# Format: VM_NAME|CPUS|MEMORY|DISK|ANSIBLE_GROUPS
# Limitation: Simulates multi-node HA quorum/failover across VMs on a single workstation,
#             whereas Production HA requires separate physical VMware ESXi hosts.
#
# Layer 1A: DevOps Services (Outside K8s)
devops-gitlab|4|6G|80G|gitlab
devops-jenkins|2|4G|40G|jenkins
devops-jenkins-agent01|2|4G|50G|jenkins_agents
devops-nexus|2|4G|80G|nexus
devops-minio01|2|2G|50G|minio

# Layer 1B: PostgreSQL 16 HA (Leader + Sync Standby + Async Replica) & Redis
pg-db1|2|2G|40G|postgresql_ha
pg-db2|2|2G|40G|postgresql_ha
pg-db3|2|2G|40G|postgresql_ha
devops-redis01|1|2G|20G|redis

# Layer 1C: Independent Monitoring & Backup Infrastructure
devops-monitor|2|4G|60G|monitoring
devops-backup|1|2G|80G|backup_services

# Layer 2: Dedicated 3-Node Kubernetes Management Cluster (Rancher + Argo CD)
k8s-mgmt-cp01|2|3G|40G|k8s_mgmt_control_plane,rancher,argocd
k8s-mgmt-cp02|2|3G|40G|k8s_mgmt_control_plane
k8s-mgmt-cp03|2|3G|40G|k8s_mgmt_control_plane

# Layer 3: 6-Node HA Application Kubernetes Cluster (Business Workloads Only)
k8s-cp01|2|4G|40G|k8s_control_plane
k8s-cp02|2|4G|40G|k8s_control_plane
k8s-cp03|2|4G|40G|k8s_control_plane
k8s-worker01|2|4G|50G|k8s_workers
k8s-worker02|2|4G|50G|k8s_workers
k8s-worker03|2|4G|50G|k8s_workers
