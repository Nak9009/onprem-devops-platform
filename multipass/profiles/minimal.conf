# multipass/profiles/minimal.conf
# Profile A: Minimal 3-Layer DevOps Testing (Section 6 Specification)
# Format: VM_NAME|CPUS|MEMORY|DISK|ANSIBLE_GROUPS
# Supports selective VM startup via ./multipass/create-vms.sh --profile minimal --only <vm1,vm2>
#
# Layer 1: DevOps, PostgreSQL, MinIO, Redis, Monitoring (Outside K8s)
devops-gitlab|2|4G|60G|gitlab
devops-jenkins|2|3G|40G|jenkins,jenkins_agents
devops-nexus|2|3G|60G|nexus,minio
pg-db1|2|2G|40G|postgresql_ha,redis
devops-monitor|2|2G|40G|monitoring,backup_services

# Layer 2: Dedicated Kubernetes Management Cluster (Rancher + Argo CD)
k8s-mgmt-cp01|2|3G|40G|k8s_mgmt_control_plane,rancher,argocd

# Layer 3: Application Kubernetes Cluster (Business Applications Only)
k8s-cp01|2|3G|40G|k8s_control_plane,k8s_workers
